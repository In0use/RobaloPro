<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Base do Ícone iOS/Android -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="8"/>

  <!-- Ondas da Rebentação -->
  <path d="M 64 340 Q 160 380 256 340 T 448 340" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="14" stroke-linecap="round"/>
  <path d="M 64 390 Q 160 430 256 390 T 448 390" fill="none" stroke="rgba(16, 185, 129, 0.2)" stroke-width="10" stroke-linecap="round"/>

  <!-- Silhueta Néon Robalo & Anzol -->
  <path d="M 120 240 C 170 140, 310 140, 390 210 C 330 230, 290 210, 240 240 C 190 270, 150 260, 120 240 Z" 
        fill="url(#neonGrad)" opacity="0.15"/>
  
  <path d="M 110 240 C 160 130, 320 130, 400 210 C 330 240, 270 200, 230 240 C 180 280, 140 260, 110 240 Z" 
        fill="none" stroke="url(#neonGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Olho de Troféu -->
  <circle cx="340" cy="195" r="12" fill="#38bdf8" />

  <!-- Barbatana -->
  <path d="M 230 155 L 270 120 L 285 165 Z" fill="url(#neonGrad)"/>
</svg>
